name: Zenime Native Android APK

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "ui/**"
      - "android/**"
      - ".github/workflows/android-rust-apk.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "ui/**"
      - "android/**"
      - ".github/workflows/android-rust-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build arm64 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK, NDK, and CMake
        run: sdkmanager "platforms;android-27" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust native library
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_JAR: /usr/local/lib/android/sdk/platforms/android-36/android.jar
          ANDROID_PLATFORM: android-36
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          test -f "$ANDROID_JAR"
          test -f "$ANDROID_HOME/platforms/android-27/android.jar"
          test -d "$ANDROID_NDK_HOME"
          echo "Android SDK platforms:"
          find "$ANDROID_HOME/platforms" -mindepth 1 -maxdepth 1 -type d -printf '%f\\n' | sort
          echo "Using android.jar: $ANDROID_JAR"
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release --lib

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Package native APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zenime-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
